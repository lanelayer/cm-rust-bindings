[package]
name = "cartesi-machine-wasm"
version = { workspace = true }
edition = { workspace = true }

authors = { workspace = true }
description = "Cartesi Machine WASM bindings — run RV64GC Linux in the browser"
homepage = { workspace = true }
license-file = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib"]

[dependencies]
cartesi-machine = { path = "../cartesi-machine" }
cartesi-machine-sys = { path = "../cartesi-machine-sys", features = ["external_cartesi"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
console_error_panic_hook = "0.1"
wee_alloc = "0.4"

[profile.release]
opt-level = "s"
lto = true
